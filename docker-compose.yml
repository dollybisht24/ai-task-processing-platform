services:
  # ==========================================
  # Database Service (MongoDB)
  # ==========================================
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "${HOST_MONGO_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ai-platform-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Message Queue & Cache Service (Redis)
  # ==========================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${HOST_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-platform-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # Backend API Service (Express.js)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_BACKEND_PORT:-5001}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:${HOST_FRONTEND_PORT:-8080}
      - MONGODB_URI=mongodb://mongodb:27017/ai_task_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your .env file}
      - JWT_EXPIRES_IN=7d
      - STREAM_KEY=tasks:stream
      - CONSUMER_GROUP=task_workers
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      ai-platform-net:
        aliases:
          - backend-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # Background Worker Service (Python 3.12)
  # ==========================================
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - WORKER_ID=worker-compose-1
      - MONGODB_URI=mongodb://mongodb:27017/ai_task_platform
      - MONGODB_DATABASE=ai_task_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STREAM_KEY=tasks:stream
      - CONSUMER_GROUP=task_workers
      - LOG_LEVEL=INFO
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - ai-platform-net

  # ==========================================
  # Frontend Web Client (React + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-platform-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  ai-platform-net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
